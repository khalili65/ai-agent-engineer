[project]
name = "ai-agent-engineer"
version = "0.1.0"
description = "Code for the AI Agent Engineer course: sessions and labs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[project.scripts]
nova = "nova.check:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]
