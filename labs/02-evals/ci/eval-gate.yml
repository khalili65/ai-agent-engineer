# The eval gate for the support agent. Not active here: GitHub only runs workflows from .github/workflows/.
# To switch it on, see "The eval gate in GitHub Actions" in labs/02-evals/README.md.
name: Eval gate

on:
  pull_request:
    paths:
      - "labs/02-evals/**"   # only when the agent, the cases or the graders change

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run the 30 cases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python labs/02-evals/run_evals.py --name ci --trials 1

      - name: Eval gate
        run: uv run python labs/02-evals/gate.py ci
